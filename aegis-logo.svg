<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="shieldBg" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#2a1d06"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="faceBg" cx="40%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#1e1400"/>
      <stop offset="100%" stop-color="#070500"/>
    </radialGradient>
  </defs>

  <!-- Shield disc -->
  <circle cx="50" cy="50" r="48" fill="url(#shieldBg)"/>

  <!-- Outer gold rim (thick) -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#C9A227" stroke-width="4.5"/>

  <!-- Outer decorative ring -->
  <circle cx="50" cy="50" r="41.5" fill="none" stroke="#C9A227" stroke-width="1"/>

  <!-- 12 decorative studs at r=44.5 (0° through 330° in 30° steps, SVG origin east, CW) -->
  <circle cx="94.5" cy="50"    r="1.6" fill="#C9A227"/>
  <circle cx="88.5" cy="72.3"  r="1.6" fill="#C9A227"/>
  <circle cx="72.3" cy="88.5"  r="1.6" fill="#C9A227"/>
  <circle cx="50"   cy="94.5"  r="1.6" fill="#C9A227"/>
  <circle cx="27.7" cy="88.5"  r="1.6" fill="#C9A227"/>
  <circle cx="11.5" cy="72.3"  r="1.6" fill="#C9A227"/>
  <circle cx="5.5"  cy="50"    r="1.6" fill="#C9A227"/>
  <circle cx="11.5" cy="27.7"  r="1.6" fill="#C9A227"/>
  <circle cx="27.7" cy="11.5"  r="1.6" fill="#C9A227"/>
  <circle cx="50"   cy="5.5"   r="1.6" fill="#C9A227"/>
  <circle cx="72.3" cy="11.5"  r="1.6" fill="#C9A227"/>
  <circle cx="88.5" cy="27.7"  r="1.6" fill="#C9A227"/>

  <!-- Inner ring (border of serpent zone) -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#C9A227" stroke-width="1.5"/>

  <!--
    Eight serpent strands radiating from the Gorgon face (r=22) to r=30.
    Each is a cubic-bezier S-curve. Arrowhead triangle at tip (r≈33).
    Positions: face-edge at r=22, tip at r=33, inner ring at r=34.

    Face edge origins (r=22):
      N  (50,28)   NE (65.6,34.4)  E  (72,50)   SE (65.6,65.6)
      S  (50,72)   SW (34.4,65.6)  W  (28,50)   NW (34.4,34.4)

    Serpent ends (r=30):
      N  (50,20)   NE (71.2,28.8)  E  (80,50)   SE (71.2,71.2)
      S  (50,80)   SW (28.8,71.2)  W  (20,50)   NW (28.8,28.8)

    Triangle tips (r=33):
      N  (50,17)   NE (73.3,26.7)  E  (83,50)   SE (73.3,73.3)
      S  (50,83)   SW (26.7,73.3)  W  (17,50)   NW (26.7,26.7)
  -->

  <!-- N serpent -->
  <path d="M 50 28 C 46.5 24 53.5 21 50 20"
        fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/>
  <polygon points="50,17 47.5,21 52.5,21" fill="#C9A227"/>

  <!-- NE serpent -->
  <path d="M 65.6 34.4 C 70.5 33.5 68.5 27.5 71.2 28.8"
        fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/>
  <polygon points="73.3,26.7 69.5,28.2 71,32" fill="#C9A227"/>

  <!-- E serpent -->
  <path d="M 72 50 C 76.5 46.5 76.5 53.5 80 50"
        fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/>
  <polygon points="83,50 79,47.5 79,52.5" fill="#C9A227"/>

  <!-- SE serpent -->
  <path d="M 65.6 65.6 C 70.5 66.5 68.5 72.5 71.2 71.2"
        fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/>
  <polygon points="73.3,73.3 71,70 69.5,73.8" fill="#C9A227"/>

  <!-- S serpent -->
  <path d="M 50 72 C 53.5 76 46.5 79 50 80"
        fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/>
  <polygon points="50,83 47.5,79 52.5,79" fill="#C9A227"/>

  <!-- SW serpent -->
  <path d="M 34.4 65.6 C 29.5 66.5 31.5 72.5 28.8 71.2"
        fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/>
  <polygon points="26.7,73.3 29,70 31.5,73.8" fill="#C9A227"/>

  <!-- W serpent -->
  <path d="M 28 50 C 23.5 53.5 23.5 46.5 20 50"
        fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/>
  <polygon points="17,50 21,52.5 21,47.5" fill="#C9A227"/>

  <!-- NW serpent -->
  <path d="M 34.4 34.4 C 29.5 33.5 31.5 27.5 28.8 28.8"
        fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/>
  <polygon points="26.7,26.7 29,30 31.5,26.2" fill="#C9A227"/>

  <!-- Gorgon face disc -->
  <circle cx="50" cy="50" r="22" fill="url(#faceBg)" stroke="#C9A227" stroke-width="1.5"/>

  <!-- Stern brows (angular, meeting at bridge) -->
  <path d="M 32.5 41 L 46 45" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/>
  <path d="M 54 45 L 67.5 41" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/>
  <path d="M 46 45 L 50 43 L 54 45" fill="none" stroke="#C9A227" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left eye (almond / vesica) -->
  <path d="M 34 48 Q 41 42.5 48 48 Q 41 53.5 34 48 Z" fill="#C9A227"/>
  <circle cx="41" cy="48" r="3.3" fill="#0c0800"/>
  <circle cx="40.2" cy="47.2" r="0.9" fill="#C9A227" opacity="0.55"/>

  <!-- Right eye (almond / vesica) -->
  <path d="M 52 48 Q 59 42.5 66 48 Q 59 53.5 52 48 Z" fill="#C9A227"/>
  <circle cx="59" cy="48" r="3.3" fill="#0c0800"/>
  <circle cx="58.2" cy="47.2" r="0.9" fill="#C9A227" opacity="0.55"/>

  <!-- Nose (minimal — bridge line + nostrils) -->
  <path d="M 50 51 L 50 57.5" stroke="#C9A227" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
  <path d="M 47.5 58.5 Q 50 61 52.5 58.5"
        fill="none" stroke="#C9A227" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>

  <!-- Open mouth curve -->
  <path d="M 42 63 Q 50 70.5 58 63"
        fill="none" stroke="#C9A227" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Three fangs -->
  <line x1="46"   y1="63.5" x2="44.8" y2="68"   stroke="#C9A227" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="50"   y1="63"   x2="50"   y2="68.5"  stroke="#C9A227" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="54"   y1="63.5" x2="55.2" y2="68"   stroke="#C9A227" stroke-width="1.3" stroke-linecap="round"/>
</svg>
