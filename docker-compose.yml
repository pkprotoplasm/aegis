services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: ${BOT_IMAGE:-aegis-bot:latest}
    env_file: .env
    volumes:
      - db_data:/data
    restart: unless-stopped
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ${API_IMAGE:-aegis-api:latest}
    env_file: .env
    volumes:
      - db_data:/data
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: ./web
    image: ${WEB_IMAGE:-aegis-web:latest}
    ports:
      - "${WEB_HOST:-0.0.0.0}:${WEB_PORT:-5000}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
